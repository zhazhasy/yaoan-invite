<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约数据实时查看</title>
  <style>
    body { margin:0; font-family:"Microsoft YaHei",sans-serif; background:#eef7f1; color:#193126; }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 12px; }
    h1 { margin: 0 0 10px; }
    .bar { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    .tag { background:#1f7a56; color:#fff; padding:6px 10px; border-radius:999px; font-size:13px; }
    table { width:100%; border-collapse: collapse; background:#fff; border-radius:10px; overflow:hidden; }
    th, td { border-bottom:1px solid #e3efe8; padding:10px; text-align:left; font-size:14px; vertical-align:top; }
    th { background:#f4fbf7; }
    .muted { color:#4c6a5b; font-size:13px; }
    .btn-del {
      border: 1px solid #d36f6f;
      background: #fff5f5;
      color: #9d2f2f;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .btn-del:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>预约数据实时查看</h1>
    <div class="bar">
      <span class="tag" id="totalTag">总计：0</span>
      <span class="muted" id="refreshInfo">正在加载...</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>提交时间</th>
          <th>单位名称</th>
          <th>联系人</th>
          <th>电话</th>
          <th>人数</th>
          <th>备注</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const LIST_API = '/api/appointments';
    const DELETE_API = '/api/appointments';

    const rowsEl = document.getElementById('rows');
    const totalTag = document.getElementById('totalTag');
    const refreshInfo = document.getElementById('refreshInfo');

    function escapeHtml(s) {
      return String(s || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadData() {
      try {
        const resp = await fetch(LIST_API);
        const json = await resp.json();
        const list = json.data || [];
        totalTag.textContent = `总计：${list.length}`;

        rowsEl.innerHTML = list.map(item => `
          <tr>
            <td>${escapeHtml(new Date(item.createdAt).toLocaleString('zh-CN'))}</td>
            <td>${escapeHtml(item.company)}</td>
            <td>${escapeHtml(item.contactName)}</td>
            <td>${escapeHtml(item.phone)}</td>
            <td>${escapeHtml(item.attendees)}</td>
            <td>${escapeHtml(item.note || '')}</td>
            <td><button class="btn-del" data-id="${escapeHtml(item.id)}">删除</button></td>
          </tr>
        `).join('');

        if (!list.length) {
          rowsEl.innerHTML = '<tr><td colspan="7" class="muted">暂无预约数据</td></tr>';
        }

        refreshInfo.textContent = `最近刷新：${new Date().toLocaleTimeString('zh-CN')}`;
      } catch (e) {
        refreshInfo.textContent = '加载失败，5秒后重试';
      }
    }

    rowsEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('.btn-del');
      if (!btn) return;
      const id = btn.dataset.id;
      if (!id) return;
      if (!window.confirm('确认删除这条预约数据吗？')) return;

      btn.disabled = true;
      try {
        const resp = await fetch(`${DELETE_API}?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        const json = await resp.json();
        if (!resp.ok || !json.ok) {
          alert(json.message || '删除失败');
        }
        await loadData();
      } catch {
        alert('删除失败，请稍后重试');
      } finally {
        btn.disabled = false;
      }
    });

    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
